<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1026">
<title>The Legend of Yura America — ЧЕПОНОСИ 3D v3</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;font-family:"Trebuchet MS","Segoe UI",Arial,sans-serif;color:#fff;-webkit-tap-highlight-color:transparent}
canvas#gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;touch-action:none;z-index:0}
canvas#c{position:fixed;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:10;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);text-align:center}
.scr.on{display:flex}
.title{font-size:min(14vw,110px);font-weight:900;letter-spacing:.04em;color:#a8ff3e;line-height:1;margin:0 0 6px;
 text-shadow:0 3px 0 #3b8a12,0 6px 0 #1d4d07,0 10px 18px rgba(0,0,0,.9),0 0 30px rgba(150,255,60,.35);-webkit-text-stroke:2px #102a04;transform:rotate(-3deg)}
.sub{font-size:min(4.6vw,22px);color:#ffe9b0;text-shadow:0 2px 3px #000;margin:4px 0 26px;max-width:520px}
.btn{font-family:inherit;background:linear-gradient(#ffc23a,#f06a0f);border:3px solid #1a0d00;border-radius:16px;padding:13px 30px;margin:7px;font-size:min(6vw,24px);font-weight:900;color:#fff;text-shadow:0 2px 0 #000;box-shadow:0 5px 0 #1a0d00,0 8px 16px rgba(0,0,0,.5);cursor:pointer;min-width:200px;touch-action:manipulation}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #1a0d00}
.btn.g{background:linear-gradient(#7be35a,#2f9e1a)}
.btn.b{background:linear-gradient(#6fb8ff,#2a6fd6)}
.btn.s{font-size:min(4.5vw,18px);padding:9px 18px;min-width:140px}
.panel{background:rgba(15,12,30,.92);border:3px solid #000;border-radius:18px;padding:18px 20px;max-width:440px;width:92%;box-shadow:0 0 0 3px #f0a020,0 12px 40px rgba(0,0,0,.7)}
.panel h2{margin:0 0 6px;font-size:min(7vw,28px);color:#ffd23f;text-shadow:0 2px 0 #000}
.panel p{font-size:min(4.4vw,18px);line-height:1.4;margin:8px 0;color:#f2f2f2}
.panel .st{color:#9f9;font-weight:bold}
.panel .lk{color:#f88;font-weight:bold}
#streetTop{position:fixed;top:0;left:0;right:0;display:none;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top) + 8px) 10px 6px;z-index:9;pointer-events:none}
#streetTop.on{display:flex}
#streetTop .btn{pointer-events:auto;min-width:0;margin:0}
#streetHint{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 10px);left:0;right:0;text-align:center;font-size:min(4.2vw,17px);color:#fff;text-shadow:0 2px 3px #000;z-index:9;display:none;pointer-events:none}
#streetHint.on{display:block}
#hud{position:fixed;inset:0;z-index:5;display:none;pointer-events:none}
#hud.on{display:block}
#topbar{position:absolute;top:calc(env(safe-area-inset-top) + 6px);left:8px;right:8px;display:flex;align-items:center;gap:8px}
#hpBox{position:relative;flex:1;max-width:360px;height:24px;background:#300;border:3px solid #000;border-radius:12px;overflow:hidden}
#hpFill{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(#ff6b6b,#c0141a);transition:width .15s}
#hpTxt{position:absolute;inset:0;font-size:14px;font-weight:900;line-height:18px;text-align:center;text-shadow:0 1px 2px #000}
#bPause{pointer-events:auto;width:44px;height:40px;border-radius:12px;border:3px solid #000;background:#333a;color:#fff;font-weight:900;font-size:18px;font-family:inherit}
#inv{position:absolute;top:calc(env(safe-area-inset-top) + 40px);left:8px;display:flex;gap:4px;pointer-events:auto}
.slot{width:46px;height:44px;background:rgba(0,0,0,.55);border:2px solid #555;border-radius:9px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:bold;color:#ddd;padding:1px}
.slot canvas{width:40px;height:24px}
.slot.on{border-color:#ffd23f;background:rgba(80,60,0,.7);color:#fff}
.slot.empty{opacity:.45}
#obj{position:absolute;top:calc(env(safe-area-inset-top) + 90px);left:8px;right:8px;text-align:center;font-size:min(4vw,16px);font-weight:bold;color:#fff;text-shadow:0 2px 2px #000,0 0 6px #000;pointer-events:none}
#obj span{background:rgba(0,0,0,.45);padding:4px 10px;border-radius:10px;display:inline-block}
#toast{position:absolute;top:34%;left:0;right:0;text-align:center;font-size:min(6.5vw,30px);font-weight:900;color:#ffd23f;text-shadow:0 3px 0 #000,0 0 12px #000;opacity:0;transition:opacity .4s;pointer-events:none;padding:0 14px}
#toast.on{opacity:1}
#joy{position:absolute;left:0;bottom:0;width:52%;height:62%;pointer-events:auto;touch-action:none}
#btns{position:absolute;right:0;bottom:0;width:48%;height:62%;pointer-events:none}
.cb{position:absolute;pointer-events:auto;touch-action:none;border-radius:50%;border:3px solid #000;font-family:inherit;font-weight:900;color:#fff;text-shadow:0 2px 0 #000;background:radial-gradient(circle at 40% 35%,#777,#333);box-shadow:0 4px 0 #000;font-size:11px;padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05}
.cb.act{transform:scale(.92);filter:brightness(1.4)}
#bFire{width:96px;height:96px;right:calc(env(safe-area-inset-right) + 16px);bottom:calc(env(safe-area-inset-bottom) + 22px);background:radial-gradient(circle at 40% 35%,#ff7a59,#b3150a);font-size:15px}
#bSwitch{width:64px;height:64px;right:calc(env(safe-area-inset-right) + 122px);bottom:calc(env(safe-area-inset-bottom) + 18px)}
#bLight{width:62px;height:62px;right:calc(env(safe-area-inset-right) + 30px);bottom:calc(env(safe-area-inset-bottom) + 128px);background:radial-gradient(circle at 40% 35%,#ffe680,#a88400)}
#bLight.off{background:radial-gradient(circle at 40% 35%,#666,#222)}
#bAnts{width:64px;height:64px;right:calc(env(safe-area-inset-right) + 112px);bottom:calc(env(safe-area-inset-bottom) + 96px);background:radial-gradient(circle at 40% 35%,#c96b3c,#5a1d05)}
#bAnts.cd{filter:grayscale(1) brightness(.7)}
#bBurn{width:92px;height:92px;right:calc(env(safe-area-inset-right) + 70px);bottom:calc(env(safe-area-inset-bottom) + 196px);background:radial-gradient(circle at 40% 35%,#ffd23f,#e04a00);display:none;font-size:13px;animation:pulse .8s infinite alternate}
#bBurn.on{display:flex}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,160,0,.8),0 4px 0 #000}to{box-shadow:0 0 0 12px rgba(255,160,0,0),0 4px 0 #000}}
.cb canvas{width:44px;height:26px}
#help .panel{text-align:left}
#help li{margin:5px 0;font-size:min(4vw,16px)}
@media (orientation:landscape) and (max-height:500px){
 #inv{top:calc(env(safe-area-inset-top) + 6px);left:auto;right:60px}
 #obj{top:calc(env(safe-area-inset-top) + 40px)}
 #hpBox{max-width:30vw}
 .title{font-size:min(14vh,90px)}
 .sub{margin-bottom:10px}
 .btn{padding:8px 24px;margin:4px}
}
body.grade canvas#gl{filter:contrast(1.18) saturate(.82) sepia(.14) brightness(1.03)}
#grain{position:fixed;inset:0;z-index:3;pointer-events:none;display:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
body.grade #grain{display:block}
#menu{justify-content:flex-end;padding-bottom:calc(env(safe-area-inset-bottom) + 14px)}
.xpwin{width:min(94vw,480px);border-radius:9px 9px 4px 4px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.7);border:2px solid #0831d9;background:#ece9d8}
.xpbar{display:flex;align-items:center;gap:6px;padding:4px 6px 5px 8px;background:linear-gradient(#0997ff,#0053ee 8%,#0050ee 40%,#06f 88%,#06f 93%,#005bff);color:#fff;font:bold 14px Tahoma,"Trebuchet MS",sans-serif;text-shadow:1px 1px #0f1089;text-align:start}
.xpbar span:nth-child(2){flex:1}
.xpbtns{display:flex;gap:2px}.xpbtns i{font-style:normal;width:21px;height:21px;border:1px solid #fff;border-radius:3px;background:linear-gradient(#3c8cff,#1f5fe0);display:flex;align-items:center;justify-content:center;font-size:13px}
.xpbtns i.x{background:linear-gradient(#e8805a,#c43b10)}
.xpbody{padding:10px 10px 12px;background:#ece9d8;color:#111}
.xpbody .title{font-size:min(8.6vw,40px);color:#ffd23f;-webkit-text-stroke:1.5px #3a1a00;transform:none;text-shadow:0 3px 0 #b35a00,0 5px 10px rgba(0,0,0,.5);margin:2px 0}
.xpbody .sub{color:#222;text-shadow:none;font-size:min(3.6vw,15px);margin:4px auto 8px}
.xprow{display:flex;justify-content:center;flex-wrap:wrap}
.xprow .btn{min-width:0;flex:1;margin:4px}
.xpp{background:#ece9d8;color:#111;box-shadow:0 0 0 3px #0831d9,0 12px 40px rgba(0,0,0,.7);border-color:#0053ee}
.xpp h2{color:#0b3fb8;text-shadow:none}.xpp p{color:#222}.xpp .st{color:#1b7a1b}.xpp .lk{color:#b31b1b}.xpp li{color:#222}
#wallet,#hudMoney{background:rgba(0,0,0,.6);border:2px solid #ffd23f;border-radius:12px;padding:5px 10px;font-weight:900;color:#ffd23f;font-size:min(4.2vw,17px);pointer-events:none;white-space:nowrap}
#hudMoney{font-size:13px;padding:3px 8px}
.money{color:#b8860b!important;font-weight:900}
#bDrink{width:58px;height:58px;right:calc(env(safe-area-inset-right) + 196px);bottom:calc(env(safe-area-inset-bottom) + 30px);background:radial-gradient(circle at 40% 35%,#d9a441,#6b3e0a);font-size:11px}
#bDrink.cd{filter:grayscale(1) brightness(.7)}
.shop{max-width:480px;max-height:92vh;overflow:auto}
.shophead{display:flex;gap:10px;align-items:center;text-align:start}
#kendiPic{width:96px;height:96px;border-radius:12px;border:3px solid #0053ee;flex:none}
.say{font-style:italic;background:#fff;border-radius:10px;padding:6px 8px;border:1px solid #999}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;border-bottom:1px solid #c8c4b0;padding:5px 0;text-align:start}
.srow .sn{font-size:14px;color:#111}.srow small{color:#555}.srow .btn{min-width:96px;margin:0;font-size:15px;padding:7px 10px}
.srow .btn:disabled{filter:grayscale(.8);opacity:.7}
#endScr.final .panel{box-shadow:0 0 0 4px #ffd23f,0 0 60px #ffd23f}
body.rtl .slot,body.rtl #inv,body.rtl #topbar{direction:ltr}
body.rtl #obj,body.rtl #toast{direction:rtl}
.xpbody .btn{font-size:min(4vw,16px);padding:7px 8px;border-radius:10px;border-width:2px;box-shadow:0 3px 0 #1a0d00}
.xpbody #bStart{font-size:min(5.5vw,22px);padding:8px 30px}
.xpbody .sub{font-size:min(3.3vw,13px)}
.xpbody .title{font-size:min(7.5vw,34px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="grain"></div>
<div id="menu" class="scr on">
 <div class="xpwin">
  <div class="xpbar"><span class="xpico">🐜</span><span>Yura_America.exe</span><span class="xpbtns"><i>_</i><i>□</i><i class="x">×</i></span></div>
  <div class="xpbody">
   <div class="title">The Legend of Yura America</div>
   <div class="sub" data-t="sub"></div>
   <button class="btn g" id="bStart" data-t="start"></button>
   <div class="xprow"><button class="btn s b" id="bHelp" data-t="howto"></button><button class="btn s b" id="bLang">МОВА</button></div>
   <div class="xprow"><button class="btn s" id="bDiff"></button><button class="btn s" id="bSound"></button></div>
   <div class="xprow"><button class="btn s" id="bRadio"></button><button class="btn s" id="bQual"></button></div>
  </div>
 </div>
</div>
<div id="langScr" class="scr"><div class="panel xpp" style="text-align:center"><h2 data-t="lang_title"></h2>
 <button class="btn s lng" data-l="uk">Українська</button><br><button class="btn s lng" data-l="ru">Русский</button><br><button class="btn s lng" data-l="en">English</button><br><button class="btn s lng" data-l="he">עברית</button><br>
 <button class="btn s b" id="bLangBack" data-t="back"></button></div></div>
<div id="help" class="scr"><div class="panel xpp"><h2 data-t="help_title"></h2><ul style="padding-inline-start:20px;margin:6px 0" data-t="help_body"></ul>
 <div style="text-align:center"><button class="btn s" id="bHelpBack" data-t="ok"></button></div></div></div>
<div id="streetTop"><button class="btn s b" id="bStreetBack" data-t="menu_back"></button><div id="wallet">0</div><button class="btn s" id="bReset" style="background:linear-gradient(#999,#555)" data-t="reset"></button></div>
<div id="streetHint" data-t="map_hint"></div>
<div id="dlg" class="scr"><div class="panel xpp"><h2 id="dlgTitle"></h2><p id="dlgDesc"></p><p id="dlgState"></p>
 <div><button class="btn g" id="bPlay" data-t="play"></button></div><div><button class="btn s b" id="bDlgBack" data-t="back"></button></div></div></div>
<div id="shopScr" class="scr"><div class="panel xpp shop">
 <div class="shophead"><canvas id="kendiPic" width="120" height="120"></canvas><div><h2 data-t="shop_title"></h2><p id="kendiSay" class="say"></p><p id="shopMoney" class="st"></p></div></div>
 <div id="shopList"></div><div style="text-align:center"><button class="btn s b" id="bShopBack" data-t="shop_close"></button></div></div></div>
<div id="hud">
 <div id="topbar"><div id="hpBox"><div id="hpFill"></div><div id="hpTxt">100</div></div><div id="hudMoney">0</div><button id="bPause">II</button></div>
 <div id="inv"></div>
 <div id="obj"><span id="objTxt"></span></div>
 <div id="toast"></div>
 <div id="joy"></div>
 <div id="btns">
  <button class="cb" id="bBurn"></button>
  <button class="cb" id="bLight" data-t="b_light"></button>
  <button class="cb" id="bAnts"><span data-t="b_ants"></span><span id="antCd"></span></button>
  <button class="cb" id="bDrink"></button>
  <button class="cb" id="bSwitch"><canvas id="swIcon" width="88" height="52"></canvas><span data-t="b_switch"></span></button>
  <button class="cb" id="bFire"></button>
 </div>
</div>
<div id="pauseScr" class="scr"><div class="panel xpp" style="text-align:center"><h2 data-t="pause"></h2><p id="pauseObj"></p>
 <button class="btn g" id="bResume" data-t="resume"></button><br><button class="btn s" id="bRestart" data-t="restart"></button><br>
 <button class="btn s" id="bSound2"></button><br><button class="btn s" id="bRadio2"></button><br><button class="btn s" id="bQual2"></button><br><button class="btn s b" id="bQuit" data-t="to_map"></button></div></div>
<div id="endScr" class="scr"><div class="panel xpp" style="text-align:center"><h2 id="endTitle"></h2><p id="endText"></p><p id="endStats" class="st"></p><p id="endReward" class="money"></p>
 <button class="btn g" id="bRespawn" data-t="respawn"></button><button class="btn g" id="bNext" data-t="next"></button><br><button class="btn s" id="bRetry" data-t="retry"></button><br><button class="btn s b" id="bEndStreet" data-t="to_map"></button></div></div>

const MC={};
function M(col,opt){const k=String(col)+(opt?JSON.stringify(opt):'');if(!MC[k])MC[k]=new THREE.MeshLambertMaterial(Object.assign({color:col},opt||{}));return MC[k];}
function MB(col,opt){const k='B'+String(col)+(opt?JSON.stringify(opt):'');if(!MC[k])MC[k]=new THREE.MeshBasicMaterial(Object.assign({color:col},opt||{}));return MC[k];}
const GC={};
function BG(w,h,d){const k='b'+w+'_'+h+'_'+d;return GC[k]||(GC[k]=new THREE.BoxGeometry(w,h,d));}
function CG(rt,rb,h,s){const k='c'+rt+'_'+rb+'_'+h+'_'+s;return GC[k]||(GC[k]=new THREE.CylinderGeometry(rt,rb,h,s));}
function SG(r,a,b){const k='s'+r+'_'+a+'_'+b;return GC[k]||(GC[k]=new THREE.SphereGeometry(r,a||8,b||6));}
function IG(r,d){const k='i'+r+'_'+(d||0);return GC[k]||(GC[k]=new THREE.IcosahedronGeometry(r,d||0));}
function mesh(geo,mat,x,y,z,parent,cast){const m=new THREE.Mesh(geo,typeof mat==='object'?mat:M(mat));m.position.set(x||0,y||0,z||0);m.castShadow=cast!==false;if(parent)parent.add(m);return m;}
function box(w,h,d,col,x,y,z,p,cast){return mesh(BG(w,h,d),col,x,y,z,p,cast);}
function cyl(rt,rb,h,s,col,x,y,z,p,cast){return mesh(CG(rt,rb,h,s),col,x,y,z,p,cast);}
function sph(r,col,x,y,z,p,cast){return mesh(SG(r),col,x,y,z,p,cast);}
function pivot(x,y,z,p){const g=new THREE.Group();g.position.set(x,y,z);if(p)p.add(g);return g;}
function texCanvas(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');fn(x,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
const TEX={};
function circleTex(){return TEX.circ||(TEX.circ=texCanvas(64,64,(c)=>{const g=c.createRadialGradient(32,32,0,32,32,32);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(0.4,'rgba(255,255,255,0.8)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(0,0,64,64);}));}
function dotTex(){return TEX.dot||(TEX.dot=texCanvas(32,32,(c)=>{c.fillStyle='#fff';c.beginPath();c.arc(16,16,13,0,7);c.fill();}));}
function textTex(txt,w,h,bg,fg,border,font){return texCanvas(w,h,(c)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);if(border){c.strokeStyle=border;c.lineWidth=h*0.08;c.strokeRect(h*0.1,h*0.1,w-h*0.2,h-h*0.2);}c.direction=(typeof LANG!=='undefined'&&LANG==='he')?'rtl':'ltr';c.fillStyle=fg;c.font=font||('900 '+Math.floor(h*0.55)+'px "Trebuchet MS",Arial,sans-serif');c.textAlign='center';c.textBaseline='middle';c.fillText(txt,w/2,h/2+h*0.03,w*0.9);});}
function grassTex(){return TEX.grass||(TEX.grass=(()=>{const t=texCanvas(128,128,(c)=>{c.fillStyle='#4b6e35';c.fillRect(0,0,128,128);for(let i=0;i<700;i++){c.fillStyle=pick(['#41622d','#557a3c','#4f7336','#5f8442','#3c5a29']);c.fillRect(Math.random()*128,Math.random()*128,2,2+Math.random()*3);}});t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})());}
function asphaltTex(){return TEX.asph||(TEX.asph=(()=>{const t=texCanvas(128,128,(c)=>{c.fillStyle='#3c3c42';c.fillRect(0,0,128,128);for(let i=0;i<900;i++){const v=50+Math.random()*30|0;c.fillStyle=`rgb(${v},${v},${v+4})`;c.fillRect(Math.random()*128,Math.random()*128,1.5,1.5);}c.strokeStyle='rgba(20,20,20,.5)';c.beginPath();c.moveTo(10,90);c.lineTo(40,80);c.lineTo(60,100);c.stroke();});t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})());}
function tileTex(col){const k='tile'+col;return TEX[k]||(TEX[k]=(()=>{const t=texCanvas(64,64,(c)=>{c.fillStyle=col;c.fillRect(0,0,64,64);c.strokeStyle='rgba(0,0,0,.18)';c.lineWidth=2;c.strokeRect(1,1,62,62);c.fillStyle='rgba(255,255,255,.05)';c.fillRect(4,4,26,26);});t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;})());}

 for(const p of L.props){

 }
